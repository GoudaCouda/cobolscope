<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="100%" height="100%" style="background:#0F172A; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Markers for Arrows -->
    <marker id="arrowDefault" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#94A3B8" />
    </marker>
    <marker id="arrowTrue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#10B981" />
    </marker>
    <marker id="arrowFalse" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#EF4444" />
    </marker>
    <marker id="arrowLoop" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#A855F7" />
    </marker>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Window Header -->
  <rect x="0" y="0" width="960" height="72" rx="12" fill="url(#headerGrad)"/>
  <rect x="0" y="60" width="960" height="12" fill="#1E293B"/>
  <line x1="0" y1="72" x2="960" y2="72" stroke="#334155" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="28" cy="36" r="6" fill="#EF4444"/>
  <circle cx="48" cy="36" r="6" fill="#F59E0B"/>
  <circle cx="68" cy="36" r="6" fill="#10B981"/>

  <!-- Header Title & Badges -->
  <text x="96" y="34" fill="#F8FAFC" font-size="16" font-weight="700">Level 3 Intra-Procedural CFG: <tspan fill="#38BDF8">PREMIERE</tspan></text>
  <text x="96" y="54" fill="#94A3B8" font-size="12">Section: PREMIERE  |  Source Lines: 197–284  |  Dead Code Status: <tspan fill="#10B981" font-weight="600">REACHABLE</tspan></text>

  <!-- Metric Badges -->
  <g transform="translate(680, 22)">
    <rect x="0" y="0" width="120" height="28" rx="6" fill="#1E3A5F" stroke="#2563EB" stroke-width="1"/>
    <text x="60" y="18" fill="#60A5FA" font-size="11" font-weight="700" text-anchor="middle">Complexity (CC): 7</text>
  </g>
  <g transform="translate(812, 22)">
    <rect x="0" y="0" width="124" height="28" rx="6" fill="#1F2937" stroke="#475569" stroke-width="1"/>
    <text x="62" y="18" fill="#CBD5E1" font-size="11" font-weight="600" text-anchor="middle">Statements: 36</text>
  </g>

  <!-- Canvas Background -->
  <rect x="0" y="72" width="960" height="688" rx="0" fill="#0B1120"/>

  <!-- FLOWCHART CONNECTIONS -->

  <!-- Entry to Setup Block -->
  <line x1="480" y1="135" x2="480" y2="160" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowDefault)"/>

  <!-- Setup Block to Condition 1 -->
  <line x1="480" y1="215" x2="480" y2="242" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowDefault)"/>

  <!-- Condition 1 TRUE (left branch) -->
  <path d="M 370 270 L 250 270 L 250 310" stroke="#10B981" stroke-width="2" fill="none" marker-end="url(#arrowTrue)"/>
  <rect x="270" y="254" width="46" height="18" rx="4" fill="#064E3B"/>
  <text x="293" y="267" fill="#34D399" font-size="10" font-weight="700" text-anchor="middle">TRUE</text>

  <!-- Condition 1 FALSE (right branch) -->
  <path d="M 590 270 L 710 270 L 710 310" stroke="#EF4444" stroke-width="2" fill="none" marker-end="url(#arrowFalse)"/>
  <rect x="644" y="254" width="48" height="18" rx="4" fill="#7F1D1D"/>
  <text x="668" y="267" fill="#F87171" font-size="10" font-weight="700" text-anchor="middle">FALSE</text>

  <!-- True branch to Merge 1 -->
  <path d="M 250 365 L 250 395 L 456 395" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrowDefault)"/>

  <!-- False branch to Merge 1 -->
  <path d="M 710 365 L 710 395 L 504 395" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrowDefault)"/>

  <!-- Merge 1 to Condition 2 -->
  <line x1="480" y1="410" x2="480" y2="435" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowDefault)"/>

  <!-- Condition 2 TRUE (left branch: NCS routine) -->
  <path d="M 350 465 L 230 465 L 230 500" stroke="#10B981" stroke-width="2" fill="none" marker-end="url(#arrowTrue)"/>
  <rect x="250" y="449" width="46" height="18" rx="4" fill="#064E3B"/>
  <text x="273" y="462" fill="#34D399" font-size="10" font-weight="700" text-anchor="middle">TRUE</text>

  <!-- Condition 2 FALSE (bypass straight to DB2 Loop) -->
  <path d="M 610 465 L 730 465 L 730 580 L 590 580" stroke="#EF4444" stroke-width="2" fill="none" marker-end="url(#arrowFalse)"/>
  <rect x="660" y="449" width="48" height="18" rx="4" fill="#7F1D1D"/>
  <text x="684" y="462" fill="#F87171" font-size="10" font-weight="700" text-anchor="middle">FALSE</text>

  <!-- NCS Block to DB2 Loop -->
  <path d="M 230 555 L 230 580 L 370 580" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrowDefault)"/>

  <!-- DB2 Loop to Terminal Exit -->
  <line x1="480" y1="620" x2="480" y2="655" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowDefault)"/>

  <!-- Loop back arrow on DB2 block -->
  <path d="M 580 575 C 640 550 640 610 582 602" stroke="#A855F7" stroke-width="2" fill="none" marker-end="url(#arrowLoop)"/>
  <rect x="615" y="568" width="60" height="18" rx="4" fill="#3B0764"/>
  <text x="645" y="581" fill="#D8B4FE" font-size="10" font-weight="700" text-anchor="middle">LOOP</text>


  <!-- FLOWCHART NODES -->

  <!-- Node: Entry Point -->
  <g transform="translate(380, 95)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="40" rx="20" fill="#064E3B" stroke="#059669" stroke-width="2"/>
    <text x="100" y="24" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">&#9658; ENTRY: PREMIERE (L197)</text>
  </g>

  <!-- Node: Basic Block 1 (Initialization) -->
  <g transform="translate(340, 160)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="55" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="14" y="22" fill="#E2E8F0" font-size="11" font-family="ui-monospace, monospace">EXEC CICS HANDLE ABEND ...</text>
    <text x="14" y="40" fill="#93C5FD" font-size="11" font-family="ui-monospace, monospace">MOVE 'N' TO INQCUST-INQ-SUCCESS</text>
  </g>

  <!-- Node: Decision 1 (IF Condition Diamond) -->
  <g transform="translate(350, 242)" filter="url(#shadow)">
    <polygon points="130,0 260,28 130,56 0,28" fill="#451A03" stroke="#D97706" stroke-width="2"/>
    <text x="130" y="24" fill="#FDE68A" font-size="11" font-weight="700" text-anchor="middle">IF INQCUST-SCODE = SPACES</text>
    <text x="130" y="38" fill="#FBBF24" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">OR LOW-VALUES (L209)</text>
  </g>

  <!-- Node: Branch 1 True Block -->
  <g transform="translate(130, 310)" filter="url(#shadow)">
    <rect x="0" y="0" width="240" height="55" rx="8" fill="#1E293B" stroke="#059669" stroke-width="1.5"/>
    <text x="120" y="24" fill="#6EE7B7" font-size="11" font-weight="600" text-anchor="middle">Default Branch</text>
    <text x="120" y="42" fill="#F8FAFC" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle">MOVE SORTCODE TO REQ-SCODE</text>
  </g>

  <!-- Node: Branch 1 False Block -->
  <g transform="translate(590, 310)" filter="url(#shadow)">
    <rect x="0" y="0" width="240" height="55" rx="8" fill="#1E293B" stroke="#DC2626" stroke-width="1.5"/>
    <text x="120" y="24" fill="#FCA5A5" font-size="11" font-weight="600" text-anchor="middle">Explicit Branch</text>
    <text x="120" y="42" fill="#F8FAFC" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle">MOVE INQCUST-SCODE TO REQ-SCODE</text>
  </g>

  <!-- Merge Node 1 -->
  <g transform="translate(456, 383)">
    <circle cx="24" cy="12" r="10" fill="#334155" stroke="#64748B" stroke-width="1.5"/>
    <text x="24" y="16" fill="#94A3B8" font-size="9" font-weight="700" text-anchor="middle">&#10138;</text>
  </g>

  <!-- Node: Decision 2 (Random vs Lookup) -->
  <g transform="translate(330, 435)" filter="url(#shadow)">
    <polygon points="150,0 300,30 150,60 0,30" fill="#451A03" stroke="#D97706" stroke-width="2"/>
    <text x="150" y="25" fill="#FDE68A" font-size="11" font-weight="700" text-anchor="middle">IF INQCUST-CUSTNO = 0000000000</text>
    <text x="150" y="42" fill="#FBBF24" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">OR 9999999999 (L225)</text>
  </g>

  <!-- Node: NCS Call Block -->
  <g transform="translate(100, 500)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="55" rx="8" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>
    <text x="130" y="22" fill="#38BDF8" font-size="11" font-weight="700" text-anchor="middle">PERFORM READ-CUSTOMER-NCS</text>
    <text x="130" y="40" fill="#94A3B8" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">FETCH FROM NAMED COUNTER</text>
  </g>

  <!-- Node: DB2 Query Loop (PERFORM UNTIL) -->
  <g transform="translate(370, 555)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="65" rx="8" fill="#2E1065" stroke="#9333EA" stroke-width="2"/>
    <text x="110" y="22" fill="#E9D5FF" font-size="11" font-weight="700" text-anchor="middle">PERFORM READ-CUSTOMER-DB2</text>
    <text x="110" y="38" fill="#C084FC" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">UNTIL EXIT-VSAM-READ = 'Y'</text>
    <text x="110" y="54" fill="#A855F7" font-size="10" font-weight="600" text-anchor="middle">&#8635; Loop Control Point (L250)</text>
  </g>

  <!-- Node: Terminal Exit -->
  <g transform="translate(365, 655)" filter="url(#shadow)">
    <rect x="0" y="0" width="230" height="40" rx="20" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <text x="115" y="25" fill="#E2E8F0" font-size="12" font-weight="700" text-anchor="middle">&#9632; EXIT: P999 / RETURN (L284)</text>
  </g>

  <!-- Legend Bottom Bar -->
  <g transform="translate(24, 715)">
    <rect x="0" y="0" width="912" height="32" rx="6" fill="#1E293B"/>
    <circle cx="20" cy="16" r="5" fill="#059669"/>
    <text x="32" y="20" fill="#94A3B8" font-size="11">Entry Point</text>

    <polygon points="120,11 127,16 120,21 113,16" fill="#D97706"/>
    <text x="134" y="20" fill="#94A3B8" font-size="11">Decision Split (IF / EVAL)</text>

    <rect x="290" y="11" width="10" height="10" rx="2" fill="#0284C7"/>
    <text x="306" y="20" fill="#94A3B8" font-size="11">Procedure Transfer (PERFORM)</text>

    <rect x="490" y="11" width="10" height="10" rx="2" fill="#9333EA"/>
    <text x="506" y="20" fill="#94A3B8" font-size="11">Loop Iteration (UNTIL)</text>

    <rect x="655" y="11" width="10" height="10" rx="2" fill="#475569"/>
    <text x="671" y="20" fill="#94A3B8" font-size="11">Terminal Exit</text>

    <line x1="770" y1="16" x2="790" y2="16" stroke="#10B981" stroke-width="2"/>
    <text x="796" y="20" fill="#34D399" font-size="11">TRUE</text>

    <line x1="845" y1="16" x2="865" y2="16" stroke="#EF4444" stroke-width="2"/>
    <text x="871" y="20" fill="#F87171" font-size="11">FALSE</text>
  </g>
</svg>